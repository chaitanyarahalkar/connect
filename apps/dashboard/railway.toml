[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/dashboard/Dockerfile"
watchPatterns = ["apps/dashboard/**", "packages/shared/**"]

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# CONNECT_API_URL / NEXT_PUBLIC_CONNECT_API_URL reference ${{api.RAILWAY_PUBLIC_DOMAIN}}
# so PR preview builds pick up the ephemeral API URL automatically.
