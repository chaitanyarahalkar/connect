[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"
watchPatterns = ["apps/api/**", "packages/**"]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# PR previews inherit production config; cross-service URLs use Railway
# reference variables (CONNECT_ISSUER, DASHBOARD_URL) set on the service.
